# Documentation site for SSG itself.
#
# Deliberately NOT named .ssg.yaml: that filename is auto-detected by every ssg
# invocation in this directory, so a config describing THIS site would hijack
# any other build run from a checkout — including the action's own test jobs,
# which is exactly what happened once the published image understood
# content_sources. Always pass it explicitly: ssg --config docs-site.yaml
#
# It has no content/<source>/ tree: the pages ARE this repository's docs/ and
# examples/ Markdown, pulled in through content_sources (CONTENT-002). Editing a
# guide and rebuilding is the whole workflow — nothing is copied or generated
# into a second location that could drift.
#
#   make site        # build into .site/
#   make site-serve  # build and serve on http://127.0.0.1:8888
template: ssgtheme
domain: ssg.tradik.com
output_dir: .site

content_sources:
  - path: docs
    type: page
    category: Documentation
  # Posts. Deliberately uncategorised: a category would generate a second
  # listing at /category/blog/ with exactly the same posts as /blog/, and two
  # self-canonical URLs holding the same content is duplicate content with
  # extra steps. The index is pages/blog.md (layout: blog).
  - path: blog
    type: post
  # Standalone pages that are not documentation — the blog index and the
  # cookie policy the consent banner links to.
  - path: pages
    type: page

# The docs site dogfoods the cookie-consent worker: its functions ship with the
# build, and ssgtheme renders the banner from variables.cookie_consent below.
workers:
  - name: cookie-consent
    dir: workers/cookie-consent
    routes_include: [/api/consent/*]
  - name: comments
    dir: workers/comments
    routes_include: [/api/comments, /api/comments/*]

# Docs cross-link each other as CONFIGURATION.md, which only resolves in a
# repository view; rewrite_md_links turns those into the built page URLs
# (anchors included), and strip_md_link_text drops the ".md" from the visible
# link text ("see CONFIGURATION" instead of "see CONFIGURATION.md").
rewrite_md_links: true
strip_md_link_text: true

# The guides also link to repository files the site never publishes
# (../examples/, the sample config). Point those at GitHub instead of 404ing.
link_rewrites:
  "../examples/": "https://github.com/spagu/ssg/tree/main/examples/"
  "../templates/": "https://github.com/spagu/ssg/tree/main/templates/"
  "../workers/": "https://github.com/spagu/ssg/tree/main/workers/"
  "../.github/": "https://github.com/spagu/ssg/blob/main/.github/"
  "../.ssg.yaml.example": "https://github.com/spagu/ssg/blob/main/.ssg.yaml.example"
check_links: warn
shortcode_errors: strict

# docs/*.md have no "## Excerpt" section; derive one from the opening paragraph
# so cards, feeds and meta descriptions are not blank.
auto_excerpt: true

# Posts live under /blog/, without the publication date: these are guides that
# stay relevant, and a date in the path only makes them look stale. The
# permalink pattern outranks post_url_format, which stays as the fallback.
permalinks:
  post: "/blog/:slug/"

post_url_format: slug

# Atom feed at /feed.xml for the 13 posts under /blog/. seo: true injects the
# <link rel="alternate"> into every page, so readers and feed autodiscovery find
# it without the theme having to know about it. Summaries rather than full
# content: the posts carry mermaid diagrams and code blocks that feed readers
# render poorly, and the excerpt is enough to decide whether to open one.
feed: true
feed_items: 20

pretty_html: true
sitemap_off: false
robots_off: false
search_index: true

# Dogfood the 1.8.14 SEO stack: seo injects the AI-first JSON-LD (BlogPosting /
# WebPage / WebSite + BreadcrumbList) alongside the theme's own OpenGraph, and
# schema adds a site-wide publisher to every page's structured data (#61).
seo: true
schema:
  publisher:
    "@type": Organization
    name: SSG
    url: https://ssg.tradik.com/

# Emit routes.json so the route contract ships with the site (#62).
route_manifest: true

# Code blocks: Chroma syntax highlighting with line numbers, and Mermaid
# diagrams rendered from ```mermaid fences (runtime injected only on pages that
# use one).
highlight: true
highlight_style: github-dark
highlight_line_numbers: true
mermaid: true
# Diagrams are transparent by default, so on the dark code chrome they were hard
# to read; box each one on a white panel with the light "neutral" theme (GO-079).
mermaid_theme: neutral
mermaid_background: "#ffffff"

# Content-address CSS/JS names, so a changed asset arrives under a new URL.
#
# Without this the generated _headers still marks /css/* and /js/* immutable for
# a year, and `immutable` tells the browser not even to revalidate — so a
# stylesheet edit stays invisible to anyone who visited before, and no change to
# the header can reach them, because they never ask again. A content hash in the
# name is the way out: the URL changes, so the stale copy is simply not
# requested, and the year-long cache becomes correct rather than dangerous.
fingerprint: true

# Assets that keep a stable path — the worker widgets, served from the site root
# and updated in place — still need to revalidate for exactly the reason above.
headers:
  # `immutable` is deliberately NOT used here, even though the names now carry a
  # content hash and it would normally be exactly right.
  #
  # _headers matches by path pattern, not by what was actually served, so the
  # rule also lands on a 404 fallback for a path under /css/. Ask for an asset in
  # the window before a deploy has propagated and the edge pins that HTML page
  # under the asset URL — for a year, unrevalidatable. That is not hypothetical:
  # it is what took the stylesheet down on this site.
  #
  # A day-long cache keeps virtually all the benefit — the hash already changes
  # the URL whenever the content does, so nothing stale is ever requested — while
  # leaving any poisoned entry to expire on its own instead of persisting.
  #
  # must-revalidate is the part that actually bites: Cloudflare Pages rewrites
  # max-age on static assets (the year comes back regardless of what is asked
  # for here) but preserves the directives, so the directive is the only
  # dependable lever. It forces a revalidation once stale rather than letting a
  # wrong cached body ride out the full year.
  /css/*:
    Cache-Control: "public, max-age=86400, must-revalidate"
  /js/*:
    Cache-Control: "public, max-age=86400, must-revalidate"
  /comments.js:
    Cache-Control: "public, max-age=0, must-revalidate"
  /comments.css:
    Cache-Control: "public, max-age=0, must-revalidate"
  /comments-admin.html:
    Cache-Control: "public, max-age=0, must-revalidate"
  /cookie-consent.js:
    Cache-Control: "public, max-age=0, must-revalidate"
  /cookie-consent.css:
    Cache-Control: "public, max-age=0, must-revalidate"

variables:
  # Horizontal "deploys natively to" strip on the home page.
  #
  # The marks are the official monochrome brand paths from Simple Icons
  # (github.com/simple-icons, CC0-1.0). They are data, not drawings: reproducing
  # a company's mark from memory gets the proportions wrong, which misrepresents
  # the brand worse than showing no mark at all. Each brand remains its owner's
  # trademark; naming them to say "this deploys there" is nominative use.
  #
  # They live in config rather than in the theme so the theme ships no site's
  # marketing — any site declares whatever integrations it actually has.
  # All Simple Icons paths use a 24x24 viewBox.
