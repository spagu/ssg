# Coverage reporting.
#
# internal/mddb/proto is generated by protoc: 2,760 statements, 16% of the
# whole tree, that nobody writes and nobody should test — a test over generated
# marshalling code asserts that protoc works. Counting it dragged the reported
# number ~16 points below the truth and, worse, made the metric move when the
# schema changed rather than when the project's own code did.
#
# With it excluded the number describes the code this project actually
# maintains: ~96%.
ignore:
  - "internal/mddb/proto/**"

coverage:
  status:
    project:
      default:
        # A release should not be blocked by a rounding wobble, but a real drop
        # is worth a red mark.
        threshold: 1%
    patch:
      default:
        # New code carries its own tests; that is the rule this project has held
        # to for every release.
        target: 90%
