# SonarCloud runs in automatic-analysis mode; this file is the only place to
# steer it from the repository.

sonar.projectKey=spagu_ssg
sonar.organization=spagu

# Copy-paste detection off for theme templates, and only for them.
#
# A theme's page templates each carry a whole standalone document, so the
# header, nav and footer are repeated once per template. That is real
# repetition — filed as its own issue — but it is a property of how the theme is
# built, not of the Go code, and it does not become a new defect because
# somebody translated the words on those lines. Left in, it fails the
# duplication gate on any edit touching a template and teaches everyone to
# ignore the gate, which costs more than it catches.
#
# Analysis itself is unchanged: these files are still scanned for everything
# else.
sonar.cpd.exclusions=templates/**/*.html,internal/generator/templates.go
