# SonarCloud analysis settings.
#
# The project uses Automatic Analysis — there is no scanner step in any
# workflow — so this file is how a decision about a rule gets recorded in the
# repository instead of clicked away in a dashboard where the reasoning is lost.

sonar.projectKey=spagu_ssg
sonar.organization=spagu

# docker:S8431 asks for either a version tag or a digest on a FROM line, never
# both. Both is deliberate here and documented above each FROM in the
# Dockerfile: the digest is what makes a build reproducible, and the tag is what
# lets Dependabot see that a newer image exists and open the bump. Keeping only
# the digest means nobody is told when it stops receiving security patches.
#
# The annotation that would silence this per line cannot be used: a trailing
# comment on a FROM line is parsed as extra arguments and fails the build, which
# is exactly how it broke on 2026-09-11.
sonar.issue.ignore.multicriteria=dockerPinnedByTagAndDigest
sonar.issue.ignore.multicriteria.dockerPinnedByTagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerPinnedByTagAndDigest.resourceKey=Dockerfile

# testdata/ directories hold inputs for the API docs readers (Go, PHP, Python,
# JavaScript), and some are wrong on purpose: a PHP view without a doctype, an
# if (true) the scanner must skip, a Python stub that returns nothing, files
# that do not parse at all. They are what the parsers are tested against, never
# shipped or run, so their findings describe the fixture, not ssg. The same
# directories are excluded from gosec (ci.yml) for the same reason.
sonar.exclusions=**/testdata/**
