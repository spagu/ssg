# Test the SSG GitHub Action
# This workflow tests the action itself using the local repository

name: Test Action

on:
  push:
    branches: [main, master]
    paths:
      - "action.yml"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test-action.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "action.yml"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/test-action.yml"

# This workflow only builds and tests; it never writes to the repo.
env:
  # Node.js 20 is deprecated on runners; run JS actions on Node 24 explicitly.
  # Every workflow carries this, not only the ones that build a release: an
  # action left on the old runtime stops working when Node 20 is removed, and a
  # scheduled security scan failing quietly is the worst place to find out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test-action:
    name: Test SSG Action
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run SSG Action (basic)
        uses: ./
        with:
          source: "test-content"
          template: "simple"
          domain: "test.example.com"
          content-dir: "content"
          templates-dir: "templates"
          output-dir: "output-test"

      - name: Verify output exists
        run: |
          if [[ -d "output-test" ]]; then
            echo "✅ Output directory created"
            ls -la output-test/
          else
            echo "❌ Output directory not found"
            exit 1
          fi

      - name: Check for required files
        run: |
          # Check for essential files
          for file in "index.html" "sitemap.xml" "robots.txt"; do
            if [[ -f "output-test/$file" ]]; then
              echo "✅ Found: $file"
            else
              echo "⚠️ Missing: $file (may be expected if no content)"
            fi
          done

  test-action-webp:
    name: Test SSG Action with WebP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run SSG Action (with WebP)
        uses: ./
        with:
          source: "test-content"
          template: "krowy"
          domain: "test-webp.example.com"
          webp: "true"
          output-dir: "output-webp"

      - name: Verify WebP conversion
        run: |
          echo "📊 Checking for WebP files..."
          find output-webp -name "*.webp" -type f | head -20 || echo "No WebP files (expected if no images in test content)"

  test-action-zip:
    name: Test SSG Action with ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run SSG Action (with ZIP)
        id: ssg
        uses: ./
        with:
          source: "test-content"
          template: "simple"
          domain: "test-zip.example.com"
          zip: "true"
          output-dir: "output-zip"

      - name: Check ZIP output
        run: |
          if [[ -f "test-zip.example.com.zip" ]]; then
            echo "✅ ZIP file created"
            ls -lh test-zip.example.com.zip
            unzip -l test-zip.example.com.zip | head -20
          else
            echo "❌ ZIP file not found"
            exit 1
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-site-zip
          path: test-zip.example.com.zip
          retention-days: 1
