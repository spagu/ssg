openapi: 3.1.0

# The shop's HTTP API, as it is actually implemented.
#
# Two halves with very different audiences: everything under /api/shop/ that a
# buyer's browser touches, and everything under /api/shop/admin/ that only the
# seller does. The public half is deliberately small — a catalogue, a checkout,
# a status, a download — because every public endpoint is an endpoint somebody
# will probe.
#
# Keep this file in step with functions/api/shop/. The tests are the other
# description of the same thing, and the two should never disagree.

info:
  title: SSG shop API
  version: "0.1.0"
  summary: Sells digital products from a static site.
  description: |
    Runs as Cloudflare Pages Functions beside a static site built by SSG.
    Prices, tax and totals are decided by the server from its own database:
    a request names products and quantities, never amounts.

    Errors share one shape — `{ error, message, requestId? }` — so a client can
    branch on `error` and show `message`. `requestId` is the Cloudflare ray, so
    a support email can be matched to a log line.
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
  contact:
    name: spagu/ssg
    url: https://github.com/spagu/ssg

servers:
  - url: https://{host}
    description: The site the shop is deployed beside.
    variables:
      host:
        default: example.com

tags:
  - name: catalogue
    description: What is for sale.
  - name: buying
    description: Turning a basket into a paid order.
  - name: delivery
    description: Getting the file to the buyer.
  - name: webhooks
    description: What the payment providers call.
  - name: admin
    description: The seller's own API, behind authentication.
  - name: module
    description: The shop as a module of the site's admin (GO-156), behind the same gate as the admin API.
  - name: acp
    description: >-
      Agentic Commerce Protocol checkout (GO-163), off unless SHOP_ACP_ENABLED is "true" (404 otherwise).
      Request and response bodies are the protocol's own, release 2026-04-17
      (github.com/agentic-commerce-protocol/agentic-commerce-protocol, spec/2026-04-17/openapi/openapi.agentic_checkout.yaml);
      they are not repeated here. Every call needs `Authorization: Bearer <SHOP_ACP_API_KEY>` and `API-Version`;
      every POST needs `Idempotency-Key`. Errors are the protocol's `{type, code, message, param?}`.
  - name: ucp
    description: >-
      Universal Commerce Protocol checkout (GO-167), off unless SHOP_UCP_ENABLED is "true" (404 otherwise).
      Bodies are the protocol's own, release 2026-04-08 (github.com/Universal-Commerce-Protocol/ucp,
      source/services/shopping/rest.openapi.json); they are not repeated here. Every call needs
      `X-API-Key: <SHOP_UCP_API_KEY>` and `UCP-Agent: profile="https://…"`; protocol errors are `{code, content}`.
      UCP.md in this template lists the choices; the business profile is GET /.well-known/ucp.

paths:
  /api/shop/products:
    get:
      tags: [catalogue]
      summary: The catalogue
      description: |
        Active products only, with their prices. Cached for a minute, so a price
        change appears quickly without a query per visitor. Nothing about files,
        keys or stock.

        A storefront page shows a handful of products, so it should ask for
        those by code — `?sku=A,B,C` — rather than download a catalogue to find
        three prices. Without that it gets one page: a shop with five thousand
        books does not answer with five thousand books.
      security: []
      parameters:
        - name: sku
          in: query
          description: Up to 50 product codes, comma-separated. Paging does not apply.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: From a previous answer's `nextCursor`.
          schema: { type: string }
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [shop, products]
                properties:
                  shop: { $ref: "#/components/schemas/ShopInfo" }
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  total: { type: integer, description: Active products in the shop. }
                  nextCursor: { type: [string, "null"] }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/products/{sku}:
    get:
      tags: [catalogue]
      summary: One product
      security: []
      parameters:
        - $ref: "#/components/parameters/Sku"
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/checkout:
    post:
      tags: [buying]
      summary: Turn a basket into an order and a payment URL
      description: |
        Accepts JSON or a form body, so a product page works without
        JavaScript. The basket is a list of product codes and quantities;
        everything about money comes from the database.

        On success with `Accept: text/html` the answer is a 303 to the payment
        page. Otherwise it is JSON carrying the order key — the secret the
        thank-you page and the invoice link need, and the only copy of it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: The order was created and the provider gave us a payment URL.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, orderKey, orderNumber, redirectUrl]
                properties:
                  orderId: { type: string, format: uuid }
                  orderKey:
                    type: string
                    description: Kept only as a hash server-side. This is the only copy.
                  orderNumber: { type: string, examples: ["O-2026-000001"] }
                  redirectUrl: { type: string, format: uri }
        "303":
          description: A browser form post; follow `Location` to the payment page.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: The anti-spam check did not pass.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The basket could not be turned into an order. `error` says which
            way: `invalid_basket`, `invalid_email`, `invalid_country`,
            `invalid_vat_id`, `waiver_required`, `unknown_gateway`,
            `unknown_sku`, `product_unavailable`, `price_not_available`,
            `country_required`, `tax_rate_missing`, `country_not_served`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            The payment provider refused to start the payment. Nothing was
            charged; the order stays pending with no provider reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/orders/{id}/status:
    get:
      tags: [buying]
      summary: What the thank-you page waits on
      description: |
        The redirect back from a provider proves nothing — anyone can open that
        URL. This reports the status the webhook wrote. A wrong key and an
        unknown order give the same 404, so the endpoint cannot be used to
        discover which order ids exist.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: k
          in: query
          required: true
          description: The order key from the checkout answer or the email.
          schema: { type: string }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/download/{token}:
    get:
      tags: [delivery]
      summary: The file
      description: |
        Streams from storage. Supports `Range`, and a ranged continuation
        within ten minutes does not cost a second download — an ereader
        fetching an EPUB in six pieces must not exhaust a limit of five.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: From the email. Stored only as a hash.
          schema: { type: string, minLength: 20, maxLength: 200 }
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, examples: ["bytes"] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested range.
        "400":
          description: That is not the shape of a download link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The order has not been paid for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: |
            The link is over: `revoked`, `expired` or `exhausted`. Each says
            which, because a buyer whose link aged out needs to know to ask for
            a new one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/resend:
    post:
      tags: [delivery]
      summary: Send the download links again
      description: |
        Always answers the same way, whether or not the address has ever bought
        anything. An endpoint that says "no such order" tells a stranger which
        addresses are customers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                orderNumber: { type: string, maxLength: 40 }
                turnstileToken: { type: string }
      responses:
        "200":
          description: Accepted. Says nothing about whether anything was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: The anti-spam check did not pass.
        "422":
          description: That is not an email address.
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/invoices/{number}:
    get:
      tags: [buying]
      summary: The buyer's invoice, as printable HTML
      description: |
        Rendered from the snapshot frozen when it was issued: if the seller has
        since changed their address or a price, this still says what it said on
        the day. Knowing an invoice number is not authorisation: `k` must be
        the order key, or the key mailed with the invoice link (issued when the
        order is paid; only its hash is stored).
      security: []
      parameters:
        - name: number
          in: path
          required: true
          description: URL-encoded; a default number contains slashes.
          schema: { type: string, examples: ["FV%2F2026%2F000001"] }
        - name: k
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The invoice.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/webhooks/stripe:
    post:
      tags: [webhooks]
      summary: Stripe's callback
      description: |
        Verifies the signature before anything is written, refuses a signature
        older than five minutes as a replay, and deduplicates on the event id.
        A duplicate delivery, an unknown order and an event we do not act on
        are all 200: providers retry, and a 500 makes them retry harder.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  action:
                    type: string
                    description: |
                      fulfilled, already-paid, duplicate, ignored, unknown-order,
                      needs-review-amount, needs-review-currency, cancelled,
                      failed, refunded, refunded-partial, error.
        "400":
          description: The signature did not verify. Nothing was written.
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/webhooks/paypal:
    post:
      tags: [webhooks]
      summary: PayPal's callback
      description: Same contract as the Stripe webhook; PayPal verifies its own signature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Received. }
        "400": { description: The signature did not verify. }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/acp/checkout_sessions:
    post:
      tags: [acp]
      summary: Create a checkout session (ACP createCheckoutSession)
      security: []
      responses:
        "201": { description: The CheckoutSession, priced by the shop. }
        "400": { description: Malformed input, a missing Idempotency-Key or API-Version. }
        "401": { description: Missing or wrong bearer token, or a bad signature. }
        "404": { description: ACP is switched off. }
        "409": { description: The same Idempotency-Key is still being processed. }
        "422": { description: The Idempotency-Key was used with another body. }
        "503": { description: ACP is on but a secret is missing, or the shop is not configured. }

  /api/shop/acp/checkout_sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [acp]
      summary: Retrieve a checkout session (ACP getCheckoutSession)
      security: []
      responses:
        "200": { description: The CheckoutSession; with `order` once completed. }
        "404": { description: No such session, or ACP is switched off. }
    post:
      tags: [acp]
      summary: Update a checkout session (ACP updateCheckoutSession)
      security: []
      responses:
        "200": { description: The updated CheckoutSession. }
        "409": { description: The session is completed, canceled, expired or being completed. }

  /api/shop/acp/checkout_sessions/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [acp]
      summary: Complete with a Stripe Shared Payment Token (ACP completeCheckoutSession)
      security: []
      responses:
        "200": { description: "Completed, with `order`; or back to ready_for_payment with a payment_declined / price_change message." }
        "400": { description: Bad payment_data, no buyer email, or the session is not ready for payment. }
        "409": { description: Completed, canceled, expired, or another completion is running. }
        "502": { description: Stripe could not be reached. Nothing stored for the key; retry. }

  /api/shop/acp/checkout_sessions/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [acp]
      summary: Cancel a checkout session (ACP cancelCheckoutSession)
      security: []
      responses:
        "200": { description: The canceled CheckoutSession. }
        "405": { description: Already completed, canceled or expired. }
        "409": { description: A completion is running. }

  /api/shop/ucp/checkout-sessions:
    post:
      tags: [ucp]
      summary: Create a checkout session (UCP create_checkout)
      security: []
      responses:
        "201": { description: The Checkout, priced by the shop (`payment.instruments` empty until paid). }
        "200": { description: "Nothing in the basket can be sold: `ucp.status: error` with messages, no session." }
        "400": { description: "Malformed input, or `invalid_profile_url` (UCP-Agent missing or not https; http too in test mode)." }
        "401": { description: Missing or wrong X-API-Key. }
        "404": { description: UCP is switched off. }
        "409": { description: The Idempotency-Key was used with another body, or is still being processed. }
        "429": { description: Too many requests; see Retry-After. }
        "503": { description: "UCP is on but a setting is missing, or SHOP_UCP_TEST_MODE next to a live configuration." }

  /api/shop/ucp/checkout-sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [ucp]
      summary: Get a checkout session (UCP get_checkout)
      security: []
      responses:
        "200": { description: "The Checkout; with `order` once completed; `ucp.status: error` and not_found when there is none." }
    put:
      tags: [ucp]
      summary: Replace a checkout session (UCP update_checkout)
      security: []
      responses:
        "200": { description: The updated Checkout. }
        "409": { description: The session is completed, canceled or being completed. }

  /api/shop/ucp/checkout-sessions/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [ucp]
      summary: Pay with Google Pay through Stripe and place the order (UCP complete_checkout)
      security: []
      responses:
        "200": { description: "Completed, with `order`; or the session with payment_declined / payment_failed / payment_ineligible messages. In test mode the suite's mock_payment_handler is accepted too." }
        "400": { description: payment.instruments is missing. }
        "409": { description: Canceled, or another completion is running. }

  /api/shop/ucp/checkout-sessions/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [ucp]
      summary: Cancel a checkout session (UCP cancel_checkout)
      security: []
      responses:
        "200": { description: The canceled Checkout (also for one already canceled). }
        "409": { description: Completed, or a completion is running. }

  /api/shop/ucp/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [ucp]
      summary: Get an order a UCP checkout placed (UCP get_order, since 1.9.11)
      security: []
      responses:
        "200": { description: "The full Order (order.json); for any other id `ucp.status: error` with a not_found message." }
        "401": { description: Missing or wrong X-API-Key. }

  /testing/simulate-shipping/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [ucp]
      summary: Conformance-suite hook, test mode only (since 1.9.11)
      description: >-
        A 404 unless SHOP_UCP_TEST_MODE is "true" and SHOP_UCP_SIMULATION_SECRET is set. Sends the order's
        snapshot again as an order event with a simulated `shipped` fulfillment event; stores nothing.
      security: []
      parameters:
        - { name: Simulation-Secret, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{status: shipped}`." }
        "403": { description: Missing or wrong Simulation-Secret. }
        "404": { description: "Test mode off, no secret configured, or no completed UCP order with this id." }
        "503": { description: Test mode next to a live configuration. }

  /api/shop/admin/me:
    get:
      tags: [admin]
      summary: Who am I, and what does this shop still need
      description: |
        Needs a session only — no permission — so an account without any shop
        permission still learns who it is and what it lacks. `permissions` is
        every shop permission in the password and Access modes. In `auth` mode
        without a session the 401 carries `mode: auth`, `loginUrl` (the login
        page, with `next` = the panel) and `refreshUrl`. `warnings` is empty
        for an account without `ecommerce:read`.
      responses:
        "200":
          description: The identity, plus everything the owner should act on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [password, access, auth] }
                  user:
                    type: [object, "null"]
                    properties:
                      id: { type: string }
                      email: { type: string }
                  permissions:
                    type: array
                    items: { type: string, enum: [ecommerce:read, ecommerce:orders, ecommerce:refund, ecommerce:products, ecommerce:settings, ecommerce:export] }
                  loginUrl: { type: [string, "null"] }
                  logoutUrl: { type: [string, "null"] }
                  refreshUrl: { type: [string, "null"] }
                  testMode: { type: boolean }
                  gateways: { type: array, items: { type: string } }
                  shopName: { type: [string, "null"] }
                  baseCurrency: { type: [string, "null"] }
                  warnings: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/module:
    get:
      tags: [module]
      summary: The module manifest
      description: |
        module.json as JSON (workers/module.schema.json): title, panel,
        navigation, permissions, endpoints. Needs `ecommerce:read` in auth mode;
        an auth service token holding exactly that is accepted too.
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Without `ecommerce:read` (`forbidden`, with `permission`)." }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/module/summary:
    get:
      tags: [module]
      summary: Numbers, to-dos and configuration problems for the admin home page
      description: |
        The module summary (workers/module-summary.schema.json, contract 1).
        Metrics: `paidOrders`, `revenue` (after refunds, in the base currency's
        main unit — the currency is in the label), `refunds` (the last 30 days)
        and `productsOnSale`. Attention items link into /ecommerce-admin/:
        orders needing review or download links, failed payment notifications,
        failing outgoing messages, test keys on a public host, VAT rates ending.
        Problems: `no_database`, `no_files`, `no_kv`, `no_gateway`, `no_mail`,
        `no_seller_details`. Aggregates only — never a person's data. Needs
        `ecommerce:read`; without D1 bound, Access and auth still get an answer
        naming `no_database`, the password mode a 503.
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { type: object, required: [contract, generatedAt, metrics, attention, problems] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Without `ecommerce:read`." }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /api/shop/admin/stats:
    get:
      tags: [admin]
      summary: The numbers the panel opens with
      description: |
        Also open to an auth service token that names `ecommerce:read` exactly
        (`serviceToken`).
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: ["7d", "30d", "365d"], default: "30d" }
      responses:
        "200":
          description: |
            Revenue, what needs attention, and what sells. Gross is every order
            paid in the window — paid, fulfilled or since refunded — and the
            refunds made in the window come off it once (`netMinor`), as in the
            module summary. `taxMinor` leaves out fully refunded orders (their
            credit note gave the VAT back). Money is never added across
            currencies: `byCurrency` has a row per currency, `byChannel` one per
            channel and currency, known channels first (web, acp, ucp). A
            refund in the window for an order paid before it gets a row with
            `orders: 0`.
          content:
            application/json:
              schema:
                type: object
                required: [window, since, byCurrency, byChannel, needsReview, stalePending, stuckMessages, topProducts, byCountry]
                properties:
                  window: { type: string, enum: ["7d", "30d", "365d"] }
                  since: { type: string, format: date-time }
                  baseCurrency: { type: string }
                  byCurrency:
                    type: array
                    items:
                      type: object
                      required: [currency, orders, grossMinor, taxMinor, refundedMinor, netMinor]
                      properties:
                        currency: { type: string }
                        orders: { type: integer }
                        grossMinor: { type: integer }
                        taxMinor: { type: integer }
                        refundedMinor: { type: integer }
                        netMinor: { type: integer, description: grossMinor − refundedMinor; may be negative. }
                  byChannel:
                    type: array
                    items:
                      type: object
                      required: [channel, currency, orders, grossMinor, refunds, refundedMinor, netMinor]
                      properties:
                        channel: { type: string, description: "web, acp or ucp (a value a later version adds is passed through)." }
                        currency: { type: string }
                        orders: { type: integer }
                        grossMinor: { type: integer }
                        refunds: { type: integer, description: Succeeded refunds made in the window. }
                        refundedMinor: { type: integer }
                        netMinor: { type: integer }
                  needsReview: { type: integer }
                  stalePending: { type: integer }
                  stuckMessages: { type: integer }
                  topProducts: { type: array, items: { type: object } }
                  byCountry: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/shop/admin/products:
    get:
      tags: [admin]
      summary: Every product, drafts included
      description: |
        Paged by cursor, like every list here. Prices are read for the page
        rather than for the shop, which is what a catalogue of thousands
        requires.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Part of a name or a product code.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: sort
          in: query
          schema: { type: string, enum: [updated, created, name, sku, status], default: updated }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200": { description: A page of the catalogue, with `total` and `nextCursor`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: That is not a status or a sort. }
    post:
      tags: [admin]
      summary: Create a product
      description: Needs ecommerce:products in `auth` mode. Created as a draft; it cannot go on sale until it has a file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name]
              properties:
                sku: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                taxCategory: { type: string, default: ebook }
                downloadLimit: { type: integer, minimum: 1, maximum: 100 }
                downloadDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: That product code is taken. }
        "422": { description: The code or the name is not usable. }

  /api/shop/admin/products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: One product, with how many times it has sold
      responses:
        "200": { description: The product. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: Edit a product, set its prices
      description: Needs ecommerce:products in `auth` mode. Prices are in minor units; `null` removes that currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [draft, active, archived] }
                taxCategory: { type: string }
                downloadLimit: { type: integer }
                downloadDays: { type: integer }
                imageUrl: { type: string }
                prices:
                  type: object
                  additionalProperties: { type: [integer, "null"] }
      responses:
        "200": { description: Saved. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: A price, a currency or the status was refused. }
    delete:
      tags: [admin]
      summary: Delete a product, or archive one that has sold
      description: |
        Needs ecommerce:products in `auth` mode. A product someone has bought is part of their order and
        their invoice forever, so it is archived. One nobody has bought is
        deleted along with its file.
      responses:
        "200":
          description: Gone, one way or the other.
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived: { type: boolean }
                  deleted: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/shop/admin/products/{id}/file:
    post:
      tags: [admin]
      summary: Upload the file buyers receive
      description: |
        Needs ecommerce:products in `auth` mode. The bytes are checked against what they claim to be — a PDF,
        EPUB or MOBI — and stored under a key derived from their hash, so
        replacing a file never overwrites what an existing order downloads.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName: { type: string }
                  fileSize: { type: integer }
                  sha256: { type: string }
                  contentType: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Larger than the configured cap. }
        "422": { description: That does not look like a book. }
        "503": { description: No file storage is bound. }

  /api/shop/admin/orders:
    get:
      tags: [admin]
      summary: Orders, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: From `nextCursor`. Carries a timestamp and an id.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatusName" }
        - name: q
          in: query
          description: An order number or part of an email address.
          schema: { type: string }
        - name: gateway
          in: query
          schema: { type: string, examples: ["stripe", "paypal", "manual"] }
        - name: channel
          in: query
          description: |
            Where the order came from: `web` (this site's checkout), `acp` (an
            AI agent platform, ACP) or `ucp` (Google's agentic checkout, UCP).
            Exact value; anything else is refused with 422 `invalid_channel`.
            Works with every other filter, the sort and the cursor.
          schema: { $ref: "#/components/schemas/OrderChannel" }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive — a date alone means the end of that day.
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: |
            Sorting changes the cursor as well as the order, because the cursor
            is the last row's value in the column being sorted on.
          schema: { type: string, enum: [date, paid, total, number, status], default: date }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: |
            A page of orders, with `total` and `nextCursor`. Each order carries
            `channel` (`web` for an order written before channels were recorded).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "That is not an order status, a channel, a sort, or a date range (`invalid_status`, `invalid_channel`, `invalid_sort`, `invalid_range`)." }

  /api/shop/admin/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin]
      summary: One order in full
      description: |
        Lines, payments, invoices and the state of every download link. The
        links themselves were never stored, only their hashes, so the panel can
        show how a download is going but can never hand the link out again.
      responses:
        "200": { description: The order. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: Keep a private note
      description: The only field a human may change here; amounts and status are decided by the payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string, maxLength: 4000 }
      responses:
        "200": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/shop/admin/orders/{id}/mark-paid:
    post:
      tags: [admin]
      summary: A bank transfer arrived, or a webhook never did
      description: |
        Needs ecommerce:orders in `auth` mode. Runs the same fulfilment a webhook runs: invoice, links,
        email. The audit entry records who decided it, because no provider
        vouches for this one.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { type: string, maxLength: 120 }
      responses:
        "200": { description: Paid and fulfilled. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: That order is not waiting for payment. }

  /api/shop/admin/orders/{id}/refund:
    post:
      tags: [admin]
      summary: Give the money back
      description: |
        Needs ecommerce:refund in `auth` mode. The refund is asked of the provider; the order changes when
        the provider's webhook confirms it, so a refund started here and one
        started in the provider's own dashboard take exactly the same path.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amountMinor:
                  type: integer
                  description: Defaults to whatever is left on the order.
      responses:
        "200": { description: The provider accepted the refund request. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not refundable, or no payment is recorded. }
        "422": { description: More than is left to refund. }
        "502": { description: The provider refused. Its reason is in the audit log. }
        "503": { description: That order's provider is not configured here. }

  /api/shop/admin/orders/{id}/resend:
    post:
      tags: [admin]
      summary: Send the download links again
      description: Cancels the old links and issues fresh ones, because their plaintext was never kept.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Queued. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not paid, no customer, or no line has a file. }

  /api/shop/admin/invoices/{number}:
    get:
      tags: [admin]
      summary: The owner's copy of an invoice or credit note, as printable HTML
      description: |
        The same page the buyer's link serves, behind the admin gate
        (`ecommerce:read` in `auth` mode). The panel fetches it with its own
        credentials and saves it, so it works with the shared password too.
      parameters:
        - name: number
          in: path
          required: true
          description: URL-encoded; a default number contains slashes.
          schema: { type: string, examples: ["FV%2F2026%2F000001"] }
      responses:
        "200":
          description: The invoice.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/shop/admin/orders/{id}/cancel:
    post:
      tags: [admin]
      summary: Put an abandoned basket to rest
      description: Only an unpaid order. A paid one is refunded, never cancelled.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { description: Cancelled. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: An order in that state cannot be cancelled. }

  /api/shop/admin/gateways:
    get:
      tags: [admin]
      summary: What the shop can take money with
      description: |
        Whether each provider is configured and which secret is missing if not,
        test keys or live, the webhook URL and the events it must be sent,
        whether one has ever arrived, and how many payments it has taken.

        There is no key in the answer and no endpoint that accepts one. Keys are
        wrangler secrets, so a database export cannot contain them and this API
        cannot read them — which is the trade against the usual design, where
        the panel stores them in a table.
      responses:
        "200": { description: Every provider, with its state and its webhook details. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Choose which providers a buyer is offered, and in what order
      description: |
        Needs ecommerce:settings in `auth` mode. The first in the list is the default at checkout. A provider
        with missing credentials is refused: its button would take a buyer to a
        502 at the last step of a purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: string, enum: [stripe, paypal] }
      responses:
        "200": { description: The new order. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Unknown provider, or one that has no credentials. }

  /api/shop/admin/settings:
    get:
      tags: [admin]
      summary: What the shop is configured to do
      description: |
        Business settings only. Secrets and bindings live in wrangler and are
        never readable here.

        `modules` reports each optional part of the shop with whether it is on
        and, when it cannot run, what it is missing — which depends on bindings
        the panel is never shown.
      responses:
        "200":
          description: The settings, the list of valid keys, and the modules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, additionalProperties: true }
                  keys: { type: array, items: { type: string } }
                  modules:
                    type: array
                    items: { $ref: "#/components/schemas/ModuleState" }
    put:
      tags: [admin]
      summary: Change some settings
      description: Needs ecommerce:settings in `auth` mode. An unknown key is refused and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |
            A value would produce wrong invoices, a key does not exist, or a
            module was switched on that cannot run — `module_unavailable`, whose
            message names what it needs.

  /api/shop/admin/vat-rates:
    get:
      tags: [admin]
      summary: The rate table
      parameters:
        - name: country
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        "200": { description: The rates, newest first. }
    post:
      tags: [admin]
      summary: Add or supersede a rate
      description: |
        Needs ecommerce:products in `auth` mode. Rates are dated, never overwritten: an invoice from March
        must still be able to explain the rate it used after the rate changes in
        July. Setting a rate closes off the one in force at that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, rateBp]
              properties:
                country: { type: string, minLength: 2, maxLength: 2 }
                kind: { type: string, default: standard, examples: [ebook] }
                rateBp:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: Basis points. 2300 is 23%.
                validFrom: { type: string, format: date-time }
      responses:
        "201": { description: Set. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: That is not a country, a rate or a date. }
    delete:
      tags: [admin]
      summary: Remove one rate
      parameters:
        - name: country
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: true
          schema: { type: string }
        - name: validFrom
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Removed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: country, kind and validFrom are all required. }

  /api/shop/admin/outbox:
    get:
      tags: [admin]
      summary: What is queued, and what is stuck
      description: |
        Shows what a message is and how it is going, never what it says: the
        payload holds download links and the buyer's details.
      parameters:
        - name: stuck
          in: query
          schema: { type: string, enum: ["1"] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: The queue. }
    post:
      tags: [admin]
      summary: Drain the queue now, or retry one message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [drain] }
                id: { type: string }
      responses:
        "200": { description: How many went out. }
        "404": { description: No queued message with that id. }

  /api/shop/admin/audit:
    get:
      tags: [admin]
      summary: Who did what
      description: Read-only. There is no endpoint that edits or clears this table.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: subject
          in: query
          schema: { type: string }
      responses:
        "200": { description: A page of entries. }

  /api/shop/admin/export:
    get:
      tags: [admin]
      summary: A CSV for the accountant
      description: |
        Also open to an auth service token that names `ecommerce:export`
        exactly (`serviceToken`): the one export a script may run.
        Amounts as decimal strings in their own currency, a byte-order mark for
        Excel, and every cell defused so a product name starting with `=` is not
        a formula.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [orders, invoices, vat], default: orders }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The file.
          content:
            text/csv:
              schema: { type: string }
        "422": { description: That type or that date range is not understood. }

components:
  securitySchemes:
    # The three admin modes (README, "Who can use the admin panel"); the first
    # one configured is the only one accepted. Every admin route also needs one
    # ecommerce:* permission in auth mode (functions/api/shop/_permissions.ts), and a
    # change carried by a cookie (Access, auth) needs `x-ssg-auth: 1` from the
    # shop's own origin.
    adminPassword:
      type: http
      scheme: basic
      description: |
        The shared password, SHOP_ADMIN_PASSWORD, as the Basic password (the
        user name is ignored). Wrong passwords lock the client address for a
        while (429).
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access's signed token (or its CF_Authorization cookie).
    authSession:
      type: apiKey
      in: cookie
      name: __Host-ssg-auth
      description: The `auth` worker's session (workers/auth/docs/CONTRACT.md).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An `auth` access token of kind "service" (workers/auth/docs/SERVICE-TOKENS.md),
        auth mode only. Accepted by GET /api/shop/admin/export, GET
        /api/shop/admin/stats and the two module routes, and only when its
        permissions name the route's permission exactly (a wildcard is
        refused); every other route answers 403 `service_token_not_accepted`.
        Needs no `x-ssg-auth` header.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Sku:
      name: sku
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }

  responses:
    BadRequest:
      description: The body could not be read.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but without the permission this needs (`permission` names it), or a change without the CSRF header from another origin.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or not yours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotConfigured:
      description: A binding this endpoint needs is not configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Over the budget for this endpoint. `error` is `rate_limited` and
        `Retry-After` says how long to wait. Budgets are per caller and per
        endpoint — exhausting the resend allowance does not stop the same person
        buying something.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable code to branch on.
        message:
          type: string
          description: A sentence to show. Never a stack trace, never SQL.
        requestId:
          type: string
          description: The Cloudflare ray, for matching a report to a log line.

    ShopInfo:
      type: object
      properties:
        name: { type: string }
        baseCurrency: { type: string, examples: ["EUR"] }
        pricingMode: { type: string, enum: [gross, net] }
        gateways: { type: array, items: { type: string } }
        termsUrl: { type: string }
        privacyUrl: { type: string }
        digitalWaiver: { type: boolean }
        resend:
          type: boolean
          description: Whether the "lost my download" form exists, so a theme does not link to a 404.

    Product:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string, examples: ["digital"] }
        imageUrl: { type: [string, "null"] }
        fileName: { type: [string, "null"] }
        fileSize: { type: [integer, "null"] }
        prices:
          type: object
          description: Currency code to minor units. 1999 EUR-minor is 19.99 €.
          additionalProperties: { type: integer }

    CheckoutRequest:
      type: object
      required: [email]
      properties:
        items:
          type: array
          description: The basket. Alternatively `sku` and `quantity` for one line.
          maxItems: 20
          items:
            type: object
            required: [sku]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 10 }
        sku: { type: string }
        quantity: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        gateway: { type: string, examples: ["stripe", "paypal"] }
        email: { type: string, format: email }
        name: { type: string, maxLength: 120 }
        country:
          type: string
          description: Two letters. Decides the VAT rate.
        vatId: { type: string, maxLength: 20 }
        locale: { type: string, maxLength: 10 }
        consentWaiver:
          description: |
            The buyer giving up the right to withdraw in exchange for immediate
            delivery. Required unless the shop has turned the waiver off.
          type: [boolean, string]
        consentMarketing: { type: [boolean, string] }
        turnstileToken: { type: string }

    OrderStatusName:
      type: string
      enum: [pending, paid, fulfilled, refunded, cancelled, needs_review, failed]

    OrderChannel:
      type: string
      description: Where an order came from (`orders.channel`).
      enum: [web, acp, ucp]

    OrderStatus:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatusName" }
        number: { type: string }
        currency: { type: string }
        totalMinor: { type: integer }
        paidAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              name: { type: string }
              quantity: { type: integer }
              totalMinor: { type: integer }
        downloads:
          type: array
          description: |
            What is still available. `url` is always empty: the links are in the
            email, because a page that shows them is a page that can be shared.
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
              expiresAt: { type: string, format: date-time }
              remaining: { type: integer }
        linksSentByEmail: { type: boolean }
        invoiceUrl:
          type: [string, "null"]
          description: |
            The invoice of a paid order, as a path on the shop carrying back the
            key the caller sent; null until one is issued.
          examples: ["/api/shop/invoices/FV%2F2026%2F000001?k=…"]

    ModuleState:
      type: object
      description: |
        Three states, not two: a module can be off, or on and unable to run.
        Calling the second one "off" would blame the seller for a missing
        secret.
      properties:
        name:
          type: string
          enum: [invoices, emails, admin_notices, webhooks, tracking, turnstile, resend]
        on: { type: boolean }
        blockedBy:
          type: [string, "null"]
          description: What is missing, in words. Null when the module can run.

security:
  - adminPassword: []
  - cloudflareAccess: []
  - authSession: []
  - serviceToken: []
