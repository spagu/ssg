# comments — needs a D1 database. Create it and paste the id:
#   npx wrangler d1 create ssg-comments
# [[d1_databases]]
# binding = "COMMENTS_DB"
# database_name = "ssg-comments"
# database_id = "<paste-d1-database-id>"

# [vars]
# COMMENTS_ORDER = "newest"       # "newest" (default) or "oldest"
# COMMENTS_CLOSE_AFTER_DAYS = "0" # 0 = never; N = stop accepting comments N days after the last activity
# COMMENTS_RETENTION_DAYS = "0"   # 0 = keep forever; N = purge spam/pending older than N days
# COMMENTS_AKISMET_URL = ""       # e.g. "https://<key>.rest.akismet.com/1.1/comment-check"
#
# Moderation auth — pick ONE (README, "Who can moderate"; the first configured wins: b, c, a):
#   (a) Shared password: set the COMMENTS_ADMIN_PASSWORD secret (below). One person, simplest.
#   (b) Cloudflare Access: put /comments-admin.html, /api/comments/admin* and
#       /api/comments/module* behind an Access application, then set both:
# COMMENTS_ACCESS_TEAM = "myteam"           # your Access team ("myteam" or "myteam.cloudflareaccess.com")
# COMMENTS_ACCESS_AUD = "<application-aud>" # the Access application's AUD tag (Access → app → Overview)
#   (c) auth worker sessions, with per-action permissions (comments:read, :moderate, :delete, :import).
#       Setting any of these turns the mode on; a partial set is a 503, and the password is then not accepted.
# COMMENTS_AUTH_ISSUER = "https://example.com/api/auth" # auth's AUTH_ISSUER (default https://<host>/api/auth)
# COMMENTS_AUTH_LOGIN_URL = "/auth/login"               # where a moderator without a session is sent
# COMMENTS_AUTH_PUBLIC_KEY = '{"kty":"EC","crv":"P-256","x":"…","y":"…"}' # auth's public JWK or JWKS (recommended)
# COMMENTS_AUTH_JWKS_URL = "/api/auth/jwks"             # …or this instead of the key (exactly one of the two)
# COMMENTS_AUTH_AUDIENCE = "example.com"                # only when auth's AUTH_AUDIENCE is not the site host

# Secrets (do NOT put here — set with `wrangler pages secret put <NAME>`):
#   COMMENTS_TURNSTILE_SECRET Cloudflare Turnstile secret (required for POST);
#                           the shared TURNSTILE_SECRET is read when it is unset
#   COMMENTS_ADMIN_PASSWORD moderation panel password (only for mode (a))
#   COMMENTS_IP_SALT        salt for the stored IP hash
#   COMMENTS_AKISMET_KEY    (optional) Akismet API key for spam scoring
