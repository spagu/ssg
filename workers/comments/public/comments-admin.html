<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Comments moderation</title>
  <meta name="description" content="Moderation panel for the site's comments: approve, mark as spam or delete what readers wrote, and import comments from an old system.">
  <!-- Nothing inline and nothing from another origin. A static page served
       by Pages carries no headers of its own, so the policy is set here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <link rel="stylesheet" href="/comments-admin-tokens.css">
  <!-- The site's own look, when the `core` worker is deployed (GO-152):
       custom properties only, after the tokens so they win. Without `core`
       it answers 404 and the tokens above stand. -->
  <link rel="stylesheet" href="/core/theme.css">
  <link rel="stylesheet" href="/comments-admin.css">
</head>
<body>
  <!-- The site's shared admin bar (GO-146), served by the `core` worker on
       this host. Without `core` the script answers 404 and the element stays
       empty and zero pixels tall: the page is as it always was. -->
  <script type="module" src="/core/nav.js"></script><ssg-admin-nav current="comments"></ssg-admin-nav>
  <main id="main">
  <h1>Comments moderation</h1>
  <p id="who" hidden>Signed in as <strong id="who-name"></strong></p>
  <p class="notice" id="notice" role="alert" hidden></p>

  <form class="login" id="login">
    <label>Password <input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
    <p class="muted" id="login-msg" role="status"></p>
  </form>

  <div id="panel" hidden>
    <div class="tabs" role="group" aria-label="Show comments by status">
      <button data-status="pending" aria-pressed="true">Pending</button>
      <button data-status="spam" aria-pressed="false">Spam</button>
      <button data-status="approved" aria-pressed="false">Approved</button>
    </div>
    <div id="list" aria-live="polite"></div>

    <details class="import" id="import">
      <summary>Import comments</summary>
      <div class="import-form">
        <p class="muted">Paste normalised JSON — an array of
          <code>{url, author, body, email?, created_at?, status?}</code>, or an
          object <code>{items: [...]}</code> — or choose a <code>.json</code> file
          converted from your old comment system.</p>
        <label>Default status for items without one
          <select id="import-status">
            <option value="approved">approved</option>
            <option value="pending">pending</option>
            <option value="spam">spam</option>
          </select>
        </label>
        <label>Comments file (JSON)
          <input type="file" id="import-file" accept="application/json,.json">
        </label>
        <label>…or paste JSON
          <textarea id="import-json" rows="6" placeholder='[{"url":"/blog/x/","author":"Ada","body":"First!","created_at":"2021-05-01T10:00:00Z"}]'></textarea>
        </label>
        <button class="primary" id="import-run" type="button">Import</button>
        <output class="muted" id="import-msg"></output>
      </div>
    </details>
  </div>
  </main>

  <script src="/comments-admin.js"></script>
</body>
</html>
