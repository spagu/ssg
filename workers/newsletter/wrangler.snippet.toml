# newsletter — needs a D1 database. Create it and paste the id:
#   npx wrangler d1 create ssg-newsletter
# [[d1_databases]]
# binding = "NEWSLETTER_DB"
# database_name = "ssg-newsletter"
# database_id = "<paste-d1-database-id>"

# [vars]
# NEWSLETTER_THANKS_URL = "/{lang}/thanks/"  # or a JSON map: '{"en":"/thanks/","pl":"/pl/dziekujemy/","default":"/thanks/"}'
# NEWSLETTER_RETENTION_DAYS = "0"            # 0 = keep; N = purge pending/unsubscribed rows untouched for N days
# NEWSLETTER_MAIL_FROM = "news@example.com"  # with a transport (key below or SMTP): double opt-in
# NEWSLETTER_MAIL_FROM_NAME = "Example News"
#
# Your own mail server — used only when neither provider key below is set
# (order: Resend → MailChannels → SMTP). 465 = TLS, 587 = STARTTLS; port 25
# is blocked by Cloudflare and refused.
# NEWSLETTER_SMTP_HOST = "smtp.example.com"
# NEWSLETTER_SMTP_PORT = "587"
# NEWSLETTER_SMTP_USER = "news@example.com"
# NEWSLETTER_SMTP_HELO = "example.com"       # optional; default: the sender's domain
#
# Admin auth — pick ONE (checked in the order Access → auth → password):
#   (a) HTTP Basic: set the NEWSLETTER_ADMIN_PASSWORD secret (below).
#   (b) Cloudflare Access: put /api/newsletter/admin* behind an
#       Access application, then set both:
# NEWSLETTER_ACCESS_TEAM = "myteam"           # "myteam" or "myteam.cloudflareaccess.com"
# NEWSLETTER_ACCESS_AUD = "<application-aud>" # the Access application's AUD tag
#   (c) accounts of the `auth` worker (the same NEWSLETTER_AUTH_* as
#       newsletter-ui): counts need newsletter:read, the CSV newsletter:export,
#       the purge newsletter:settings. Any one set turns the mode on; an
#       incomplete set answers 503; with them set the password is NOT
#       accepted — delete the secret when you switch.
# NEWSLETTER_AUTH_ISSUER = "https://example.com/api/auth"
# NEWSLETTER_AUTH_LOGIN_URL = "/auth/login"
# NEWSLETTER_AUTH_PUBLIC_KEY = '<the AUTH_PUBLIC_KEY= line scripts/auth-keys.mjs prints>'  # or:
# NEWSLETTER_AUTH_JWKS_URL = "/api/auth/jwks"   # exactly one of the two
# NEWSLETTER_AUTH_AUDIENCE = "example.com"      # optional; default the request's host

# Secrets (do NOT put here — set with `wrangler pages secret put <NAME>`):
#   NEWSLETTER_TURNSTILE_SECRET     Turnstile secret (required; the shared
#                                   TURNSTILE_SECRET is read when it is unset)
#   NEWSLETTER_HASH_SALT            salt for the stored IP / User-Agent hashes
#   NEWSLETTER_ADMIN_PASSWORD       admin endpoint password (auth mode (a))
#   NEWSLETTER_RESEND_API_KEY       optional — double opt-in mail via Resend
#   NEWSLETTER_MAILCHANNELS_API_KEY optional — double opt-in mail via MailChannels
#   NEWSLETTER_SMTP_PASSWORD        optional — SMTP login password
