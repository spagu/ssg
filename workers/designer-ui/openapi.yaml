openapi: 3.1.0
info:
  title: designer-ui API
  version: 0.1.0
  summary: The API of the ssg designer-ui worker — the site's settings and theme files in its repository, behind `auth` accounts.
  description: |
    Every path is relative to the worker's base path, `DESIGNER_BASE` (default
    `/designer`). The worker accepts `auth` sessions only (README, "Auth is
    required"): a person's session cookie `__Host-ssg-auth`, or a service
    token in `Authorization: Bearer` — never one in the place of the other
    (`wrong_kind`). Without a complete `DESIGNER_AUTH_*` set every path,
    the panel's files included, answers `503 {"error": "auth_not_configured",
    "detail"}`. An unknown `DESIGNER_PLAN` (neither `free` nor `paid`) answers
    `503 {"error": "bad_plan", "detail"}` on every path, naming the variable.

    Permissions: each operation's `x-permission` names what the caller must
    hold; a missing one is answered `403 {"error": "forbidden", "permission":
    "<name>"}`. A settings publication touching keys of the class `executes`
    or `secret`, or any value holding a `$NAME` reference, also needs
    `designer-ui:advanced`; without it the whole publication is refused with
    `403 {"error": "forbidden", "permission": "designer-ui:advanced", "keys":
    [...], "refused": [{"key", "reason": "needs designer-ui:advanced"}]}`
    naming every such key. The checks are made by the operations themselves,
    so the MCP endpoint (`POST /mcp`) refuses exactly as these routes do.

    `designer-ui:theme` and `designer-ui:advanced` are declared sensitive in
    module.json: an `auth` service token carries them only when an owner
    allowed it (`allowSensitive`) — once `AUTH_KNOWN_PERMISSIONS` lists this
    module.

    Settings are written to `.ssg.designer.json` only — never to `.ssg.yaml`.
    No answer carries the value of a secret: a value inside a secret key is
    `{"set": bool, "reference": "$NAME" | null}`.

    A state-changing request authenticated by the cookie must carry an
    `Origin` of this site or `Sec-Fetch-Site: same-origin`; otherwise it is
    answered `403 {"error": "cross_origin"}`. A bearer request needs neither.

    Errors are JSON `{"error": "<snake_case_code>", "detail"?: "…"}`.
    Answers common to every route, not repeated below: `401 {"error":
    "unauthorized", "reason": "no_session" | "expired" | "invalid_session"}`
    (a page request is redirected to the login page instead, with a `next`
    back here), `403` (a permission missing, or a cross-origin write), `404`,
    `405` (with `allow`), `429` (the RATE_LIMITER binding or the repository
    host, with `retry-after`), `500 internal_error`, `502` (the repository
    host refused the token or failed), `503` (`auth_not_configured`,
    `repo_not_configured`, `not_configured` for an unusable key,
    `auth_unavailable` when the keys cannot be fetched).
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
servers:
  - url: https://example.com/designer
    description: Your site's origin plus DESIGNER_BASE

security:
  - authSession: []
  - serviceToken: []

tags:
  - name: module
    description: "The module manifest, health and summary"
  - name: session
    description: "Who is signed in and what they may do"
  - name: settings
    description: "Every setting of the site, written to .ssg.designer.json"
  - name: theme
    description: "The theme's files under <templates_dir>/<template>"
  - name: revisions
    description: "The repository's history of a theme file or the settings"
  - name: mcp
    description: "The same operations as MCP tools, for an AI assistant or a script (JSON-RPC 2.0)"

paths:
  /api/module:
    get:
      tags: [module]
      operationId: getModule
      summary: The module manifest (module.json)
      x-permission: designer-ui:read
      responses:
        "200":
          description: The manifest as in module.json.
          content:
            application/json:
              schema:
                type: object
  /api/health:
    get:
      tags: [module]
      operationId: getHealth
      summary: Configuration state — never a secret's value, no request to the repository
      x-permission: designer-ui:read
      responses:
        "200":
          description: What is configured.
          content:
            application/json:
              schema:
                type: object
                required: [ok, auth, repository, schemaVersion, plan, bindings]
                properties:
                  ok: { type: boolean, description: The repository variables are complete. }
                  auth: { type: string, enum: [auth] }
                  repository:
                    type: object
                    required: [configured]
                    properties:
                      configured: { type: boolean }
                      provider: { type: string, enum: [github] }
                      branch: { type: [string, "null"], description: "DESIGNER_GIT_BRANCH, or null for the repository's default branch." }
                      problem: { type: string, description: Which variable is missing or malformed (never its value). }
                  schemaVersion: { type: integer, description: The version of the configuration schema the worker validates against. }
                  plan: { $ref: "#/components/schemas/ActivePlan" }
                  bindings:
                    type: object
                    properties:
                      assets: { type: boolean }
                      rateLimiter: { type: boolean }
  /api/module/summary:
    get:
      tags: [module]
      operationId: getModuleSummary
      summary: The module summary (workers/module-summary.schema.json)
      x-permission: designer-ui:read
      description: |
        Settings set in the panel, theme files, the branch publications go
        to, and the problems of the repository, the configuration, the
        settings file and the theme. Counts and fixed sentences only.
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                type: object
  /api/me:
    get:
      tags: [session]
      operationId: getMe
      summary: Who is signed in and which of this module's permissions they hold
      x-permission: designer-ui:read
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required: [kind, user, permissions, sessionExpiresAt, loginUrl, logoutUrl, refreshUrl]
                properties:
                  kind: { type: string, enum: [user, service] }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                  permissions: { type: array, items: { type: string } }
                  sessionExpiresAt: { type: string, format: date-time }
                  loginUrl: { type: string }
                  logoutUrl: { type: string }
                  refreshUrl: { type: string }
  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Every setting of the site — schema, value and where the value comes from
      x-permission: designer-ui:read
      description: |
        One entry per key the settings file can address by name (the
        configuration schema of ssg, `ssg config schema`). `source` is
        `overlay` (.ssg.designer.json), `file` (.ssg.yaml), `default`, or
        `unknown` when the file sets the key but the worker's reader could
        not follow it (`unread` says where and why — never a guess).
        `overlayBlobId` is the version a publication names as its base.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [head, branch, configFile, configFormat, overlayFile, overlayBlobId, overlayKeys, schemaVersion, groups, entries, problems]
                properties:
                  head: { type: string }
                  branch: { type: string }
                  configFile: { type: [string, "null"] }
                  configFormat: { type: [string, "null"], enum: [yaml, json, toml, null] }
                  overlayFile: { type: string, const: .ssg.designer.json }
                  overlayBlobId: { type: [string, "null"] }
                  overlayKeys: { type: array, items: { type: string } }
                  schemaVersion: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string }, title: { type: string }, description: { type: string } }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/SettingEntry" }
                  problems:
                    type: array
                    items:
                      type: object
                      properties: { code: { type: string }, detail: { type: string } }
  /api/settings/publish:
    post:
      tags: [settings]
      operationId: publishSettings
      summary: One commit of .ssg.designer.json with the changed settings
      x-permission: designer-ui:settings
      description: |
        Each change names a key by its path of keys and sets `value`; `null`
        removes the key from the settings file (the file's value or the
        default applies again). Lists are replaced whole. The next file is
        validated as ssg validates it; keys of the class `executes` or
        `secret`, and values holding `$NAME`, need `designer-ui:advanced`.
        A secret is accepted only as a reference (`$NAME`, `login:$NAME`,
        `Bearer $NAME`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, baseBlobId, changes]
              properties:
                message: { type: string, description: The commit message, written by the person publishing. }
                baseBlobId: { type: [string, "null"], description: overlayBlobId from GET api/settings. }
                changes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [path, value]
                    properties:
                      path: { type: array, items: { type: string }, minItems: 1 }
                      value: { description: "The new value, or null to remove the key from the settings file." }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commitId: { type: string }
                  branch: { type: string }
                  blobId: { type: string }
                  changed: { type: array, items: { type: string } }
        "400": { description: "invalid_change, invalid_json, invalid_message, no_change" }
        "409": { description: "conflict (with conflicts), overlay_needs_yaml, overlay_unreadable, branch_protected" }
        "403": { description: "forbidden — designer-ui:settings missing, or keys needing designer-ui:advanced: {permission, keys, refused}" }
        "422": { description: "invalid_settings with problems, each naming a key's path, and refused: [{key, reason}] — the same split per key (unknown configuration key, a wrong type, a secret not written as a reference)" }
        "413": { description: "too_large — the body is over 8 MiB (28 MiB with DESIGNER_PLAN = \"paid\")" }
  /api/theme:
    get:
      tags: [theme]
      operationId: listTheme
      summary: The theme's files, or why the theme cannot be edited here
      x-permission: designer-ui:read
      responses:
        "200":
          description: |
            `available: true` with the files, or `available: false` with
            `reason` (`no_template`, `theme_dir_unknown`, `online_theme`,
            `theme_not_in_repository`) and a `detail` saying how to bring the
            theme into the repository.
          content:
            application/json:
              schema:
                type: object
                required: [available, head, branch]
                properties:
                  available: { type: boolean }
                  head: { type: string }
                  branch: { type: string }
                  template: { type: [string, "null"] }
                  dir: { type: [string, "null"] }
                  files:
                    type: array
                    items:
                      type: object
                      properties: { path: { type: string }, blobId: { type: string }, size: { type: integer, description: Bytes, when the host said. }, text: { type: boolean } }
                  truncated: { type: boolean }
                  reason: { type: string }
                  detail: { type: string }
  /api/theme/files/{path}:
    get:
      tags: [theme]
      operationId: readThemeFile
      summary: One theme file — UTF-8 text, or base64 for images and fonts
      x-permission: designer-ui:read
      parameters:
        - { name: path, in: path, required: true, schema: { type: string }, description: "The repository path, URL-encoded as one segment (slashes as %2F)." }
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileBody" }
        "400": { description: path_not_allowed }
        "409": { description: "The theme cannot be edited here (the reasons of GET api/theme)." }
  /api/theme/publish:
    post:
      tags: [theme]
      operationId: publishTheme
      summary: One commit with the changed theme files
      x-permission: designer-ui:theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, changes]
              properties:
                message: { type: string }
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [op]
                    properties:
                      op: { type: string, enum: [put, delete, move] }
                      path: { type: string }
                      from: { type: string }
                      to: { type: string }
                      content: { type: object, description: "{text} or {base64}" }
                      baseBlobId: { type: [string, "null"], description: "The version read; null for a new file." }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commitId: { type: string }
                  branch: { type: string }
                  blobIds: { type: object, additionalProperties: { type: [string, "null"] } }
        "400": { description: "path_not_allowed (outside the theme folder or an extension not on the list), invalid_change" }
        "409": { description: "conflict (with conflicts), branch_protected, or the theme cannot be edited here" }
        "413": { description: too_large }
  /api/publish:
    post:
      tags: [settings, theme]
      operationId: publish
      summary: Settings and theme files in one commit
      description: >-
        One atomic commit with the settings overlay and the theme files. Needs
        designer-ui:settings for a settings part (plus designer-ui:advanced for
        the keys that ask for it) and designer-ui:theme for a theme part; a
        mixed publication needs all of them and is refused whole, before
        anything is written, when one is missing.
      x-permission: designer-ui:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                settings:
                  type: object
                  description: As the body of POST /api/settings/publish, without message.
                  required: [baseBlobId, changes]
                  properties:
                    baseBlobId: { type: [string, "null"] }
                    changes: { type: array, items: { type: object, required: [path, value], properties: { path: { type: array, items: { type: string } }, value: {} } } }
                theme:
                  type: object
                  description: As the body of POST /api/theme/publish, without message.
                  required: [changes]
                  properties:
                    changes: { type: array, items: { type: object } }
      responses:
        "200":
          description: Published as one commit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commitId: { type: string }
                  branch: { type: string }
                  settings: { type: object, properties: { blobId: { type: string }, changed: { type: array, items: { type: string } } } }
                  theme: { type: object, properties: { blobIds: { type: object, additionalProperties: { type: [string, "null"] } } } }
        "400": { description: "invalid_change (no part, or a part of the wrong shape), path_not_allowed, no_change" }
        "403": { description: "forbidden with permission (and keys, refused for designer-ui:advanced); nothing is written" }
        "409": { description: "conflict (with conflicts naming the overlay or a theme file), overlay_needs_yaml, overlay_unreadable, branch_protected, or the theme cannot be edited here" }
        "413": { description: too_large }
        "422": { description: "invalid_settings (with problems and refused: [{key, reason}])" }
  /api/revisions:
    get:
      tags: [revisions]
      operationId: listRevisions
      summary: The commits that changed a theme file, the settings file or the config file
      x-permission: designer-ui:read
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties: { commitId: { type: string }, message: { type: string }, authorName: { type: string }, authorEmail: { type: string }, date: { type: string } }
                  nextCursor: { type: [string, "null"] }
  /api/revisions/{commitId}:
    get:
      tags: [revisions]
      operationId: readRevision
      summary: A theme file, or the settings (redacted), as they were at a commit
      x-permission: designer-ui:read
      parameters:
        - { name: commitId, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "kind theme: the file as in api/theme/files; kind settings: {settings} redacted as in api/settings, with the problems ssg would report."
          content:
            application/json:
              schema:
                type: object
        "400": { description: "path_not_allowed, not_served (the config file's text), invalid_change (commitId)" }
  /api/preview:
    get:
      tags: [theme]
      operationId: preview
      summary: A page of the site with unpublished colour and font tokens applied (GO-188)
      description: |
        The worker fetches a public page of its own host (no credentials of
        the caller, same-origin redirects only, at most 256 KiB of HTML on
        DESIGNER_PLAN free and 2 MB on paid, 10 s per fetch), removes
        every script, event handler and script URL, and injects the tokens.
        Served for the panel's <iframe sandbox> with its own policy:
        no script source, `sandbox`, `frame-ancestors 'self'`. Every other
        query parameter whose name starts with "--" is a token; its value is
        letters, digits, spaces and # , . % ( ) + - / _ ' " only, never
        holding url(, expression( or // (bad_token). Only tokens are
        previewed; templates and settings are as the site was built.
      x-permission: designer-ui:read
      parameters:
        - { name: path, in: query, required: false, description: "A path on this host, e.g. /blog/post/ (default /); never a URL", schema: { type: string, maxLength: 2048 } }
        - { name: page, in: query, required: false, description: "latest: the first entry of the feed the home page announces", schema: { type: string, enum: [latest] } }
        - { name: scheme, in: query, required: false, description: "Forced on <html data-theme> and color-scheme", schema: { type: string, enum: [light, dark] } }
        - { name: lang, in: query, required: false, description: "Language of the page explaining an error", schema: { type: string, enum: [en, pl, hi, de, fr] } }
      responses:
        "200": { description: "The sanitized page", content: { text/html: { schema: { type: string } } } }
        "400": { description: "A page (text/html) explaining bad_path or bad_token" }
        "404": { description: "A page explaining page_not_found or no_latest_post" }
        "413": { description: "A page explaining page_too_large (over the plan's page limit)" }
        "415": { description: "A page explaining not_html" }
        "502": { description: "A page explaining redirect_off_host, too_many_redirects or page_unavailable" }
        "504": { description: "A page explaining upstream_timeout (the site took more than 10 s)" }
  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: The MCP endpoint — one JSON-RPC message per POST, one JSON answer
      x-permission: designer-ui:read
      description: |
        Model Context Protocol over Streamable HTTP, stateless: protocol
        2026-07-28 (requests carrying `_meta["io.modelcontextprotocol/
        protocolVersion"]`) and the `initialize`-based 2025-11-25,
        2025-06-18 and 2025-03-26. Methods: `initialize`, `ping`,
        `server/discover`, `tools/list`, `tools/call`; notifications
        (`notifications/initialized`) are answered `202` with no body. No
        session (`Mcp-Session-Id` is ignored, none is minted), no SSE stream,
        no batches. GET is answered `405`.

        Needs `designer-ui:read`; `tools/list` shows only the tools whose
        permissions the caller holds, and every `tools/call` runs the
        operation through the same permission check as the REST route — a
        refusal is a tool result with `isError: true` and, as
        `structuredContent`, the route's error body plus its `status`. The
        tools and their arguments: README, "MCP".

        A modern request must mirror its body in `MCP-Protocol-Version`,
        `Mcp-Method` and (for `tools/call`) `Mcp-Name`. An `Origin` other than
        this site's is refused `403`. The body may have at most 8 MiB (28 MiB with
        `DESIGNER_PLAN = "paid"`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
      responses:
        "200":
          description: A JSON-RPC response — a `result`, or an `error` (`-32601` unknown method in the initialize era, `-32602` unknown tool or bad arguments, `-32603` internal error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202":
          description: A notification, accepted.
        "400":
          description: "JSON-RPC error without a result: `-32700` parse error (also: not UTF-8), `-32600` invalid request (a batch, a bad `jsonrpc`, `method` or `id`), `-32602` invalid params (`params` not an object, missing `_meta` keys), `-32020` header mismatch, `-32022` unsupported protocol version (`data: {supported, requested}`)."
        "403":
          description: "`forbidden` without `designer-ui:read`, `cross_origin` for a cookie session's foreign write, or a JSON-RPC `-32600` for a foreign `Origin`."
        "404":
          description: "`-32601` method not found, for a modern (2026-07-28) request."
        "406":
          description: "`-32600` — `Accept` admits no `application/json`."
        "413":
          description: "`-32600` — the body is larger than 8 MiB (28 MiB on Paid)."
        "415":
          description: "`-32600` — send `application/json`."

components:
  schemas:
    ActivePlan:
      type: object
      description: |
        The plan whose limits the worker applies, set by `DESIGNER_PLAN`
        (`free` when unset or empty, or `paid`). An unknown value answers
        `503 {"error": "bad_plan", "detail"}` on every path.
      required: [plan, limits, subrequests, maxBody]
      properties:
        plan: { type: string, enum: [free, paid] }
        limits: { $ref: "#/components/schemas/ChangeLimits" }
        subrequests: { type: integer, description: "Requests one call may make to the repository host (45 Free, 125 Paid)." }
        maxBody: { type: integer, description: "The largest request body in bytes, REST and MCP (8 MiB Free, 28 MiB Paid)." }
    ChangeLimits:
      type: object
      description: What one publication may carry on the active plan (2 MiB / 10 files Free; 10 MiB per file, 20 MiB, 50 files Paid).
      required: [maxFilesPerChange, maxFileBytes, maxChangeBytes]
      properties:
        maxFilesPerChange: { type: integer }
        maxFileBytes: { type: integer }
        maxChangeBytes: { type: integer }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { const: "2.0" }
        id: { oneOf: [{ type: string }, { type: integer }], description: Absent for a notification; never null. }
        method: { type: string, examples: [tools/call] }
        params: { type: object, description: "`{name, arguments, _meta?}` for tools/call." }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { const: "2.0" }
        id: { oneOf: [{ type: string }, { type: integer }] }
        result: { type: object, description: "tools/call: `{content: [{type: text, text}], structuredContent, isError}`; modern requests add `resultType` and `_meta`." }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    SecretState:
      type: object
      required: [set, reference]
      properties:
        set: { type: boolean }
        reference: { type: [string, "null"], description: "The $NAME reference the secret is written as; null for anything else." }
    SettingEntry:
      type: object
      required: [path, segments, node, class, source]
      properties:
        path: { type: string, description: "The schema path, e.g. mddb.lang" }
        segments: { type: array, items: { type: string } }
        node: { type: object, description: "The schema node without fields (type, enum, default, description, group, items, values, alternate)." }
        class: { type: string, enum: [plain, executes, secret] }
        source: { type: string, enum: [overlay, file, default, unknown] }
        value: { description: "The effective value; inside secret keys a SecretState." }
        unread: { type: string }
    FileBody:
      type: object
      required: [path, blobId, encoding]
      properties:
        path: { type: string }
        blobId: { type: string }
        head: { type: string }
        encoding: { type: string, enum: [text, base64] }
        text: { type: string }
        base64: { type: string }
  securitySchemes:
    authSession:
      type: apiKey
      in: cookie
      name: __Host-ssg-auth
      description: A person's session of the `auth` worker on this host.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A service token of the `auth` worker (kind `service`).
