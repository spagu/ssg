        maxAttempts: { type: integer }
        queue: { type: boolean }
    CampaignStats:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        recipients:
          type: object
          properties:
            total: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            pending: { type: integer }
            uncertain: { type: integer }
        bounces:
          type: object
          description: Always null counts with a detail — a bounce cannot be credited to a campaign without guessing
          properties:
