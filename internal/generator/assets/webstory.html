{{define "story"}}<!doctype html>
<html amp lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<link rel="canonical" href="{{.Canonical}}">
<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
<script async src="https://cdn.ampproject.org/v0.js"></script>
<script async custom-element="amp-story" src="https://cdn.ampproject.org/v0/amp-story-1.0.js"></script>
<style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
<style amp-custom>
amp-story{font-family:Georgia,"Times New Roman",serif;color:#fff}
amp-story-grid-layer.scrim{background:linear-gradient(to top,rgba(32,33,36,.92) 0%,rgba(32,33,36,.55) 38%,rgba(32,33,36,0) 62%)}
amp-story-grid-layer.text{align-content:end;padding:0 24px 64px}
h1,h2{font-size:2.2em;line-height:1.15;margin:0 0 .3em;font-weight:700}
p{font-size:1.4em;line-height:1.35;margin:0}
.publisher{font-family:Arial,Helvetica,sans-serif;font-size:.85em;letter-spacing:.06em;text-transform:uppercase;color:#e8eaed;margin-bottom:.8em}
</style>
</head>
<body>
<amp-story standalone title="{{.Title}}" publisher="{{.Publisher}}" publisher-logo-src="{{.PublisherLogo.URL}}" poster-portrait-src="{{.Poster.URL}}">
<amp-story-page id="{{.Cover.ID}}">
{{template "story-image" .Cover}}
<amp-story-grid-layer template="fill" class="scrim"></amp-story-grid-layer>
<amp-story-grid-layer template="vertical" class="text">
<p class="publisher">{{.Publisher}}</p>
<h1>{{.Title}}</h1>
</amp-story-grid-layer>
</amp-story-page>
{{range .Pages}}<amp-story-page id="{{.ID}}">
{{template "story-image" .}}
{{if .Caption}}<amp-story-grid-layer template="fill" class="scrim"></amp-story-grid-layer>
<amp-story-grid-layer template="vertical" class="text">
<p>{{.Caption}}</p>
</amp-story-grid-layer>
{{end}}</amp-story-page>
{{end}}<amp-story-page id="{{.CTA.ID}}">
{{template "story-image" .CTA}}
<amp-story-grid-layer template="fill" class="scrim"></amp-story-grid-layer>
<amp-story-grid-layer template="vertical" class="text">
<h2>{{.Title}}</h2>
</amp-story-grid-layer>
<amp-story-page-outlink layout="nodisplay">
<a href="{{.CTAURL}}">{{.CTALabel}}</a>
</amp-story-page-outlink>
</amp-story-page>
</amp-story>
</body>
</html>
{{end}}{{define "story-image"}}<amp-story-grid-layer template="fill">
<amp-img src="{{.Image.URL}}" width="{{.Image.Width}}" height="{{.Image.Height}}" layout="responsive" alt="{{.Alt}}"></amp-img>
</amp-story-grid-layer>{{end}}
