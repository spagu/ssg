name: static-site-generator
# The version is NOT hardcoded here: it is read from ./VERSION at build time by
# the `ssg` part below (adopt-info). A literal `version:` field is what let the
# Snap Store sit on 1.8.6 from 1.8.6 through 1.8.12 while every release reported
# a successful publish — sync-version.sh never covered this file, so the number
# was frozen. Reading the single source of truth directly makes drift impossible
# (OPS-013). Fixed in 1.8.13; the range above is history — do NOT bump it.
adopt-info: ssg
title: SSG - Static Site Generator
summary: Fast static site generator written in Go
description: |
  SSG converts Markdown content with YAML frontmatter to static HTML sites.

  Features:
  - Built-in HTTP server with watch mode
  - WebP image conversion
  - Cloudflare Pages deployment support
  - Multiple template engines (Go, Pongo2, Mustache, Handlebars)
  - SEO-friendly URL generation
  - Config variables with env var support
  - .md link rewriting
  - Custom content paths (pages_path, posts_path)
  - Preserve slug case option

grade: stable
confinement: strict
license: BSD-3-Clause
base: core24

contact: https://github.com/spagu/ssg/issues
issues: https://github.com/spagu/ssg/issues
source-code: https://github.com/spagu/ssg
website: https://github.com/spagu/ssg
donation: https://github.com/sponsors/spagu

platforms:
  amd64:
  arm64:

apps:
  static-site-generator:
    command: bin/ssg
    plugs:
      - home
      - removable-media
      - network
      - network-bind
  ssg:
    command: bin/ssg
    plugs:
      - home
      - removable-media
      - network
      - network-bind

parts:
  ssg:
    # plugin: nil (not "go") so snapcraft's Go plugin does not run its compiler
    # version check, which chokes on the "go: downloading go1.26.5" line emitted
    # when go.mod's toolchain (>= 1.26.5) is newer than the go snap. GOTOOLCHAIN
    # stays "auto", so `go build` fetches the required toolchain cleanly.
    plugin: nil
    source: .
    source-type: local
    build-snaps:
      - go/latest/stable
    # Bundle avifenc so AVIF output works under strict confinement, where
    # exec.LookPath only sees the snap's own rootfs — the host's binaries are
    # invisible (#114). cwebp comes from the `cwebp` part below.
    stage-packages:
      - libavif-bin
    build-environment:
      - GOTOOLCHAIN: auto
    override-build: |
      # Single source of truth: ./VERSION is copied in with `source: .`, so the
      # snap version and the binary's -X main.Version can never disagree with the
      # release, and no packaging-sync step has to remember this file (OPS-013).
      VERSION="$(tr -d '[:space:]' < VERSION)"
      craftctl set version="$VERSION"
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      go build -ldflags "-s -w -X main.Version=$VERSION" -o "$SNAPCRAFT_PART_INSTALL/bin/ssg" ./cmd/ssg
      # Bundle the WordPress migration engine for the same reason as cwebp
      # above (#114): `ssg migrate wordpress` execs wpexporter, and a strictly
      # confined snap sees only its own rootfs. The host's copy is invisible —
      # and installing the wpexporter SNAP does not help either, because a snap
      # cannot execute another snap ("cannot join mount namespace of pid 1").
      # `go install pkg@latest` is module-aware and ignores this repo's go.mod,
      # so it always picks up wpexporter's newest tagged release.
      GOBIN="$SNAPCRAFT_PART_INSTALL/bin" go install -ldflags "-s -w" \
        github.com/tradik/wpexporter/cmd/wpexporter@latest

  # cwebp, built from source instead of staging Ubuntu's `webp` package. That
  # package also ships vwebp, an OpenGL viewer, and its dependencies pulled 50
  # packages into the snap — freeglut, Mesa, LLVM 20, ICU and libxml2 — none of
  # which cwebp uses. The Snap Store's security notices then reported libxml2 and
  # the rest as outdated packages in a static site generator. ssg hands cwebp
  # only JPEG and PNG, so GIF input is left out (TIFF is never searched for).
  # libpng and libjpeg are linked shared, from the two staged packages, not
  # from the static archives libwebp's CMake prefers: a statically linked copy
  # is invisible to the Store's scan, and its fixes would reach nobody unnoticed.
  # The tag is pinned by hand (Dependabot cannot see it): take the newest
  # vX.Y.Z from https://github.com/webmproject/libwebp/tags.
  cwebp:
    plugin: nil
    source: https://github.com/webmproject/libwebp.git
    source-tag: v1.6.0
    source-depth: 1
    build-packages:
      - cmake
      - libjpeg-dev
      - libpng-dev
    stage-packages:
      - libjpeg-turbo8
      - libpng16-16t64
    override-build: |
      cmake -S "$CRAFT_PART_SRC" -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_SHARED_LIBS=OFF \
        -DWEBP_BUILD_CWEBP=ON \
        -DWEBP_BUILD_DWEBP=OFF \
        -DWEBP_BUILD_GIF2WEBP=OFF \
        -DWEBP_BUILD_IMG2WEBP=OFF \
        -DWEBP_BUILD_VWEBP=OFF \
        -DWEBP_BUILD_WEBPINFO=OFF \
        -DWEBP_BUILD_WEBPMUX=OFF \
        -DWEBP_BUILD_EXTRAS=OFF \
        -DWEBP_BUILD_ANIM_UTILS=OFF \
        -DCMAKE_DISABLE_FIND_PACKAGE_GIF=ON \
        -DPNG_LIBRARY_RELEASE="/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpng.so" \
        -DJPEG_LIBRARY_RELEASE="/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libjpeg.so"
      cmake --build build --target cwebp --parallel "$CRAFT_PARALLEL_BUILD_COUNT"
      install -D -m 0755 build/cwebp "$CRAFT_PART_INSTALL/usr/bin/cwebp"
