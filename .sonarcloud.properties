# SonarCloud Automatic Analysis reads THIS file (sonar-project.properties is
# read only by a scanner run, which this project does not use).

# workers/<template>/ are copied one directory at a time by
# `ssg new worker <name>`, so each template must stand alone: the newsletter's
# Cloudflare Access check and Turnstile helpers repeat the comments template's
# on purpose. A shared module would break the scaffold, so duplication across
# templates is the design, not a defect to report.
sonar.cpd.exclusions=workers/**

# testdata/ holds inputs for the parsers (API docs readers and others), some
# wrong on purpose; findings there describe a fixture, not ssg.
sonar.exclusions=**/testdata/**
